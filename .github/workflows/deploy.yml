name: Deploy naar GitHub Pages

on:
  push:
    branches:
      - claude/streampick-omdb-api-Pt3x2
      - claude/focused-davinci-blM6T
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencies installeren
        run: npm ci

      - name: App bouwen
        run: npm run build
        env:
          VITE_BASE_URL: /contentool/

      - name: Deployen naar gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
